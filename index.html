if(!['preprimary','school','iti','diploma','degree','pg','phd'].includes(profile.course)){profile.course=profile.course==='undergraduate'?'degree':profile.course==='postgraduate'?'pg':'degree';}

const $=s=>document.querySelector(s);
function saveLocal(){localStorage.setItem('sa_profile',JSON.stringify(profile));localStorage.setItem('sa_saved',JSON.stringify(saved));}
function days(d){return Math.ceil((new Date(d+'T23:59:59')-new Date())/86400000)}
function matches(s){
  const levels=s.courses||(s.course==='any'?['preprimary','school','iti','diploma','degree','pg','phd']:[s.course]);
  if(!levels.includes(profile.course))return false;
  if(s.gender!=='any'&&profile.gender&&s.gender!==profile.gender)return false;
  if(s.tags.some(x=>['SC','OBC','EBC','DNT','ST'].includes(x))&&profile.category&&!s.tags.includes(profile.category))return false;
  if(s.tags.includes('Disability')&&!profile.disability)return false;
  if(s.state&&s.state!=='any'&&profile.state&&s.state.toLowerCase()!==profile.state.toLowerCase())return false;
  return true;
}
function card(s){
  let d=days(s.deadline),match=matches(s);
  const docs=s.docs||[
    'Student photograph and identity proof (as specified by the scheme)',
    'Current admission/enrolment proof or bonafide certificate',
    'Previous class marksheet or academic record',
    'Bank account details/passbook, if required',
    'Income certificate, if the scheme has an income limit',
    'Caste/community, domicile, or disability certificate only if applicable to the scheme',
    'Fee receipt and any scheme-specific form/certificate, if required'
  ];
  const hasNSPDeadline=!!s.deadline&&s.url===NSP;
  const deadlineText=hasNSPDeadline?(d>=0?`NSP-listed deadline: ${new Date(s.deadline+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})} · ${d} day${d===1?'':'s'} left`:`NSP-listed date: ${new Date(s.deadline+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})} — confirm current status`):'Deadline: check the official scheme notice';
  return `<article class="card sch"><h3>${s.name}</h3><div class="muted">${s.org}</div><div class="chips">${s.tags.map(x=>`<span class="chip">${x}</span>`).join('')} ${match?'<span class="chip match">✓ Possible match — verify eligibility</span>':''}</div><div class="deadline">📅 ${deadlineText}${s.deadlineNote?`<div class="muted small">${s.deadlineNote}</div>`:''}</div><div class="muted small">${s.amount}</div><details class="docs-panel"><summary>📄 Documents needed for this scholarship</summary><p class="small muted">Preparation checklist only. The exact required documents depend on the scheme and may change. Confirm the official scheme instructions before applying.</p><ul>${docs.map(x=>`<li>${x}</li>`).join('')}</ul><p class="small"><b>Tip:</b> Keep clear scans/photos ready, but upload documents only on the official application portal.</p></details><div class="actions"><button class="btn light" onclick="toggleSave(${s.id})">${saved.includes(s.id)?'★ Saved':'☆ Save'}</button><button class="btn primary" onclick="window.open('${s.url}','_blank','noopener')">Official site ↗</button></div></article>`
}

  <div class="field"><label>Choose your avatar</label><div class="avatar-row">${avatars.map(a=>`<button type="button" class="avatar-choice ${p.avatar===a?'selected':''}" onclick="chooseAvatar('${a}')">${a}</button>`).join('')}</div></div>
  <div class="field"><label>Name</label><input id="name" value="${p.name||''}" placeholder="Your name"></div>
  <div class="two"><div class="field"><label>Education level</label><select id="course" onchange="updateYearOptions()"><option value="preprimary" ${p.course==='preprimary'?'selected':''}>Pre-primary (Nursery/LKG/UKG)</option><option value="school" ${p.course==='school'?'selected':''}>School (Class 1–12)</option><option value="iti" ${p.course==='iti'?'selected':''}>ITI / Vocational</option><option value="diploma" ${p.course==='diploma'?'selected':''}>Diploma</option><option value="degree" ${p.course==='degree'?'selected':''}>Undergraduate / Degree</option><option value="pg" ${p.course==='pg'?'selected':''}>Postgraduate / Master's</option><option value="phd" ${p.course==='phd'?'selected':''}>PhD / Research</option></select></div><div class="field"><label>Class / year</label><select id="year"></select></div></div>
  <div class="two"><div class="field"><label>Branch</label><input id="branch" value="${p.branch||''}" placeholder="CSE"></div><div class="field"><label>State</label><input id="state" value="${p.state||''}" placeholder="Karnataka"></div></div>
  <div class="two"><div class="field"><label>Gender (optional)</label><select id="gender"><option value="">Prefer not to say</option><option value="male" ${p.gender==='male'?'selected':''}>Male</option><option value="female" ${p.gender==='female'?'selected':''}>Female</option></select></div><div class="field"><label>Category (optional)</label><select id="category"><option value="">Not specified</option><option ${p.category==='SC'?'selected':''}>SC</option><option ${p.category==='ST'?'selected':''}>ST</option><option ${p.category==='OBC'?'selected':''}>OBC</option><option ${p.category==='EBC'?'selected':''}>EBC</option><option ${p.category==='DNT'?'selected':''}>DNT</option></select></div></div>
  <label><input type="checkbox" id="disability" ${p.disability?'checked':''}> I may qualify for disability-specific scholarships</label>
  <button class="btn primary" onclick="saveProfile()">Save profile</button>
  <button class="btn gray" onclick="notifyMe()">Enable notifications 🔔</button>
  ${currentUser?'<button class="btn gray" onclick="signOutAccount()">🚪 Sign out</button>':''}
  </div></div>
  <div class="card small muted" style="margin-top:12px">Your Google account identifies your profile. Scholarship eligibility must always be verified on the official scheme page.</div>`
  updateYearOptions();
}
function updateYearOptions(){
  const course=$('#course')?.value, select=$('#year'); if(!select)return;
  const choices=course==='preprimary'?['Nursery','LKG','UKG']:course==='school'?Array.from({length:12},(_,i)=>String(i+1)):course==='iti'?['1','2']:course==='diploma'?['1','2','3']:course==='degree'?['1','2','3','4','5']:course==='pg'?['1','2','3']:['Research'];
  const current=String(profile.year||choices[0]);
  select.innerHTML=choices.map(v=>`<option value="${v}" ${v===current?'selected':''}>${course==='school'?'Class '+v:course==='preprimary'?v:course==='phd'?'Research / PhD year '+v:'Year '+v}</option>`).join('');
  if(!choices.includes(current))select.value=choices[0];
}
function chooseAvatar(a){profile.avatar=a;profilePage()}
async function saveProfile(){
  profile={...profile,avatar:profile.avatar||'🎓',name:$('#name').value.trim(),course:$('#course').value,year:$('#year').value,branch:$('#branch').value.trim(),state:$('#state').value.trim(),gender:$('#gender').value,category:$('#category').value,income:'',disability:$('#disability').checked};
  saveLocal();
  if(currentUser){
    try{
      await setDoc(doc(db,'users',currentUser.uid),{profile,displayName:currentUser.displayName||'',email:currentUser.email||'',updatedAt:new Date().toISOString()},{merge:true});
      alert('Profile saved to your account ✓');
    }catch(e){
      console.error(e);
      alert('Profile saved on this device, but Firebase could not save it yet. Check Firestore Rules.');
    }
  }else{
    alert('Profile saved on this device. Sign in with Google to sync it across devices.');
  }
  render();show('home');
}
function toggleSave(id){saved.includes(id)?saved=saved.filter(x=>x!==id):saved.push(id);saveLocal();render()}
async function notifyMe(){
  if(!('Notification'in window)){alert('Notifications are not supported in this browser. Try Chrome.');return}
  let p=await Notification.requestPermission();
  if(p==='granted')new Notification('ScholarSphere is ready',{body:'Notification permission is enabled. Automatic scholarship alerts will be connected in the next notification setup.'});
  else alert('Notification permission was not granted.');
}
function handleAccount(){
  if(currentUser){
    show('profile');
    profilePage();
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  signInWithGoogle();
}
async function signInWithGoogle(){
  try{
    await signInWithPopup(auth,googleProvider);
  }catch(e){
    console.error(e);
    alert('Google sign-in could not start: '+(e.message||e.code));
  }
}
async function signOutAccount(){
  try{
    await signOut(auth);
    alert('Signed out.');
  }catch(e){
    console.error(e);
    alert('Could not sign out: '+(e.message||e.code));
  }
}
async function loadCloudProfile(user){
  try{
    const snap=await getDoc(doc(db,'users',user.uid));
    if(snap.exists()&&snap.data().profile){
      profile={...profile,...snap.data().profile};
      saveLocal();
    }
  }catch(e){console.warn('Could not load Firestore profile:',e)}
}
function updateAccountButton(){
  const b=$('#accountBtn');
  if(currentUser)b.innerHTML=`<span class="account-avatar">${profile.avatar||'🎓'}</span>${profile.name||currentUser.displayName||currentUser.email||'Account'}`;
  else b.textContent='🔐 Sign in';
}
function show(page){
  document.querySelectorAll('main>section').forEach(x=>x.classList.add('hide'));
  $('#'+page).classList.remove('hide');
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
  if(page==='home')home();if(page==='all')all();if(page==='states')stateDirectory();if(page==='saved')savedPage();if(page==='profile')profilePage();if(page==='add')addListingPage();
}
function render(){home();all();stateDirectory();savedPage();profilePage();updateAccountButton()}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>show(x.dataset.page));


onAuthStateChanged(auth,async user=>{
  currentUser=user;
  if(user) await loadCloudProfile(user);
  render();
});


function ssEsc(value){
  return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function addListingPage(){
  const target = document.querySelector('#add');
  if(!target) return;
  target.innerHTML = `
    <div class="section"><div><h2>Grow the opportunity directory</h2><p class="muted small">Add a scholarship, grant, fellowship or education-support programme.</p></div></div>
    <div class="premium-note"><b>Important:</b> new listings are saved on this device only. To publish them for everyone, connect a secured backend/admin API before launch. Never add private API secrets here.</div>
    <div class="add-panel">
      <h2>Add an opportunity</h2>
      <form id="ssAddForm" class="form">
        <div class="field"><label for="ssName">Scholarship / programme name *</label><input id="ssName" required maxlength="180" placeholder="Programme name"></div>
        <div class="two">
          <div class="field"><label for="ssOrg">Provider / organisation *</label><input id="ssOrg" required maxlength="140" placeholder="Official provider"></div>
          <div class="field"><label for="ssType">Funding type</label><select id="ssType"><option>Merit</option><option>Need-based</option><option>Welfare</option><option>Private</option><option>Fellowship</option><option>Grant</option><option>Research</option><option>Other</option></select></div>
        </div>
        <div class="two">
          <div class="field"><label for="ssCourse">Education level</label><select id="ssCourse">
            <option value="any">All levels / varies</option><option value="preprimary">Nursery / Pre-primary</option><option value="school">School</option><option value="iti">ITI / Vocational</option><option value="diploma">Diploma</option><option value="degree">Undergraduate / Degree</option><option value="pg">Postgraduate</option><option value="phd">PhD / Research</option>
          </select></div>
          <div class="field"><label for="ssState">State / region</label><input id="ssState" maxlength="100" placeholder="Any / Karnataka / global"></div>
        </div>
        <div class="two">
          <div class="field"><label for="ssDeadline">Official deadline (if confirmed)</label><input id="ssDeadline" type="date"></div>
          <div class="field"><label for="ssAmount">Award / funding</label><input id="ssAmount" maxlength="120" placeholder="Amount or not confirmed"></div>
        </div>
        <div class="field"><label for="ssUrl">Official programme URL * (HTTPS only)</label><input id="ssUrl" type="url" required placeholder="https://official-provider.example/scholarship"></div>
        <div class="field"><label for="ssTags">Tags (comma separated)</label><input id="ssTags" maxlength="300" placeholder="STEM, merit, first year"></div>
        <div class="field"><label for="ssReason">Eligibility / verification notes</label><textarea id="ssReason" maxlength="1200" rows="4" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px" placeholder="Summarise only details supported by the official source. Note anything not yet confirmed."></textarea></div>
        <label style="display:flex;gap:9px;align-items:flex-start;font-size:13px"><input type="checkbox" id="ssVerified"> I checked the official source for this programme and the details above.</label>
        <div class="form-actions"><button class="btn primary" type="submit">＋ Save listing on this device</button><button class="btn gray" type="button" onclick="ssExport()">Export custom listings</button><button class="btn gray" type="button" onclick="document.querySelector('#ssImportFile').click()">Import backup</button><input id="ssImportFile" type="file" accept=".json,application/json" class="hide"></div>
      </form>
      <div class="security-note">Data safety: listing text is escaped before rendering, URLs must use HTTPS, and imported files are validated. Device-local records are not shared with other visitors and may be lost if browser storage is cleared. Do not enter passwords, API keys, identity documents or other secrets.</div>
    </div>
    <div class="add-panel"><div class="section" style="margin-top:0"><h2>Your added listings</h2><span class="chip">${customScholarships.length} on this device</span></div>
      <div id="ssCustomList">${customScholarships.length ? customScholarships.map(x=>`<div class="card" style="margin-bottom:8px"><b>${ssEsc(x.name)}</b><div class="muted small">${ssEsc(x.org)} · ${ssEsc(x.deadline || 'Date unconfirmed')}</div><div class="actions"><a class="btn gray" href="${ssEsc(x.url)}" target="_blank" rel="noopener noreferrer">Official source ↗</a><button class="btn gray" type="button" onclick="ssDelete(${Number(x.id)})">Delete</button></div></div>`).join('') : '<div class="empty muted">No custom listings yet. Add one above or import a backup.</div>'}</div>
    </div>`;
  document.querySelector('#ssAddForm').addEventListener('submit', ssSaveListing);
  document.querySelector('#ssImportFile').addEventListener('change', ssImport);
}
function ssSaveListing(event){
  event.preventDefault();
  const name=document.querySelector('#ssName').value.trim();
  const org=document.querySelector('#ssOrg').value.trim();
  const url=document.querySelector('#ssUrl').value.trim();
  if(!name || !org){alert('Enter the programme name and provider.');return;}
  let parsed;
  try{parsed=new URL(url)}catch(e){alert('Enter a valid official URL.');return;}
  if(parsed.protocol!=='https:'){alert('For safety, only HTTPS official URLs are accepted.');return;}
  const deadline=document.querySelector('#ssDeadline').value || null;
  const id=Date.now();
  const verified=document.querySelector('#ssVerified').checked;
  const tags=document.querySelector('#ssTags').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,20);
  tags.push(verified?'Source checked by contributor':'Needs official-source verification');
  const item={id,name:ssEsc(name),org:ssEsc(org),type:document.querySelector('#ssType').value,course:document.querySelector('#ssCourse').value,gender:'any',state:ssEsc(document.querySelector('#ssState').value.trim()||'any'),deadline,amount:ssEsc(document.querySelector('#ssAmount').value.trim()||'Not confirmed'),tags:tags.map(ssEsc),url:parsed.href,reason:ssEsc(document.querySelector('#ssReason').value.trim()||'Eligibility, award and current application status need confirmation on the official source.'),custom:true,sourceChecked:verified};
  customScholarships.push(item);
  scholarships.push(item);
  try{localStorage.setItem('ss_custom_scholarships',JSON.stringify(customScholarships));}
  catch(e){customScholarships.pop();scholarships.splice(scholarships.findIndex(x=>x.id===id),1);alert('Browser storage is full or unavailable. Export your data and try again.');return;}
  alert('Listing saved on this device. It is not yet published to other visitors.');
  addListingPage(); render(); show('add');
}
function ssDelete(id){
  if(!confirm('Delete this custom listing from this device?'))return;
  customScholarships=customScholarships.filter(x=>Number(x.id)!==Number(id));
  const i=scholarships.findIndex(x=>Number(x.id)===Number(id)&&x.custom);
  if(i>=0)scholarships.splice(i,1);
  localStorage.setItem('ss_custom_scholarships',JSON.stringify(customScholarships));
  addListingPage();render();show('add');
}
function ssExport(){
  const blob=new Blob([JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),items:customScholarships},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='scholarsphere-custom-listings.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function ssImport(event){
  const file=event.target.files?.[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(String(reader.result||''));
      const rows=Array.isArray(data)?data:data.items;
      if(!Array.isArray(rows)||rows.length>5000)throw new Error('Expected a JSON array with no more than 5,000 records.');
      const clean=[];
      for(const r of rows){
        if(!r||typeof r.name!=='string'||typeof r.org!=='string'||typeof r.url!=='string')continue;
        const u=new URL(r.url);if(u.protocol!=='https:')continue;
        clean.push({...r,id:Date.now()+clean.length,name:ssEsc(r.name.slice(0,180)),org:ssEsc(r.org.slice(0,140)),type:ssEsc(String(r.type||'Other').slice(0,60)),course:['any','preprimary','school','iti','diploma','degree','pg','phd'].includes(r.course)?r.course:'any',gender:['any','male','female'].includes(r.gender)?r.gender:'any',state:ssEsc(String(r.state||'any').slice(0,100)),deadline:/^\d{4}-\d{2}-\d{2}$/.test(String(r.deadline||''))?r.deadline:null,amount:ssEsc(String(r.amount||'Not confirmed').slice(0,120)),tags:(Array.isArray(r.tags)?r.tags:[]).slice(0,20).map(t=>ssEsc(String(t).slice(0,80))),reason:ssEsc(String(r.reason||'Verify current status and eligibility on the official source.').slice(0,1200)),url:u.href,custom:true});
      }
      const map=new Map(customScholarships.map(x=>[String(x.id),x]));
      clean.forEach(x=>map.set(String(x.id),x));
      customScholarships=[...map.values()];
      scholarships.splice(0,scholarships.length,...builtInScholarships,...customScholarships);
      localStorage.setItem('ss_custom_scholarships',JSON.stringify(customScholarships));
      alert(`Imported ${clean.length} valid HTTPS listings to this device.`);
      addListingPage();render();show('add');
    }catch(e){alert('Could not import this file. Check that it is a valid ScholarSphere JSON backup.');}
  };
  reader.readAsText(file);
}
function ssQuickSearch(){
  const q=document.querySelector('#ssHeroSearch')?.value?.trim();
  show('all');
  const input=document.querySelector('#q');
  if(input&&q){input.value=q;input.dispatchEvent(new Event('input',{bubbles:true}));}
}

Object.assign(window,{show,all,stateDirectory,savedPage,profilePage,saveProfile,toggleSave,notifyMe,handleAccount,chooseAvatar,addListingPage,ssExport,ssDelete,ssQuickSearch});
render();
</script>
